# 産婦人科データ Path Patching 設定
# Medical Path Patching Configuration

# データ設定
data:
  train_path: "/home/Competition2025/P05/shareP05/data/gynecology_guideline_2023_some_models_correct_formatted/train.parquet"
  test_path: "/home/Competition2025/P05/shareP05/data/gynecology_guideline_2023_some_models_correct_formatted/test.parquet"

  # Phase 1出力
  annotated_data_path: "Phase1_data_preparation/annotated_medical_data.jsonl"
  counterfactual_data_path: "Phase1_data_preparation/counterfactual_medical_data.jsonl"
  path_patching_data_path: "Phase1_data_preparation/medical_path_patching_enhanced.jsonl"

# モデル設定
model:
  path: "/home/Competition2025/P05/shareP05/models/Qwen3-14B"
  num_layers: 40
  num_heads: 40
  head_dim: 128
  dtype: "bfloat16"
  device_map: "auto"

# Path Patching設定
path_patching:
  batch_size: 2
  sample_num: 10  # テスト用サンプル数（-1で全サンプル）
  extract_attention: true
  module_input_name: "model.layers.{}.input_layernorm"
  module_output_name: "model.layers.{}.self_attn.o_proj"

  # 出力ディレクトリ
  output_dir: "Phase2_path_patching/results"
  results_file: "results.pt"
  attention_patterns_file: "attention_patterns.pt"

# Counterfactual生成設定
counterfactual:
  strategy: "medical_term_replacement"  # medical_term_replacement | full_replacement | minimal_replacement
  preserve_grammar: true

# Head Classification設定
head_classification:
  # 分類基準ファイル
  criteria_config: "configs/head_classification_params.yaml"

  # 出力ディレクトリ
  output_dir: "Phase3_attention_analysis"
  classification_results_file: "head_classification_results.json"
  medical_patterns_file: "medical_specific_patterns.json"

# 可視化設定
visualization:
  output_dir: "Phase4_visualization"
  heatmap_dir: "Phase4_visualization/heatmaps"
  report_file: "Phase4_visualization/medical_head_analysis_report.md"

  # ヒートマップ設定
  color_scheme:
    medical_term: "red"
    guideline_indicator: "blue"
    reasoning_flow: "green"
    unclassified: "gray"

  # プロット設定
  figsize: [12, 10]
  dpi: 150
  format: "png"

# Pinpoint Tuning設定（Phase 5）
pinpoint_tuning:
  # ヘッド選択設定
  selection:
    max_total_heads: 64  # 全体の4%（40層×40ヘッド=1600の4%）
    medical_priority_impact: 0.05  # impact > 5%で選択
    guideline_priority_impact: 0.08
    reasoning_priority_impact: 0.10

  # 出力
  trainable_heads_file: "Phase5_pinpoint_tuning/trainable_heads.json"

  # SPT設定
  spt:
    precise_level: 5  # functional_classification mode
    train_kv: false
    learning_rate: 3e-5
    num_epochs: 3
    batch_size_per_device: 1
    global_batch_size: 32

# ロギング設定
logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  save_logs: true
  log_file: "medical_path_patching.log"
